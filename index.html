<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3Cellipse cx='16' cy='16' rx='11' ry='4.5' fill='none' stroke='white' stroke-width='2' transform='rotate(-25 16 16)'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050816" />
    <meta name="description" content="Orbit: quiz games for the classroom. Build question sets, host a game, students join with a code." />
    <title>Orbit</title>
    <!-- Apply the saved theme before the first paint (no white flash). Space (dark) is the default. -->
    <script>
        try {
            var t = sessionStorage.getItem('session_theme') || localStorage.getItem('theme') || 'dark';
            var c = sessionStorage.getItem('session_colorTheme') || localStorage.getItem('colorTheme') || 'green';
            document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', c);
        } catch (e) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
